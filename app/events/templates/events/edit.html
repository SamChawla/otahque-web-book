{% extends "base.html" %}

{% block title %}Edit {{ title }} | Otahque{% endblock %}

{% block content %}
  <h1>Edit {{ title }}</h1>
  {% if taken %}
    <p class="rounded-box border border-base-content
              px-3 py-1 text-sm">
      Places taken: {{ taken }}. Otahque does not tell
      members about changes yet.</p>
  {% endif %}
  <form method="post" class="card space-y-4 border
        border-base-300 bg-base-100 p-6">
    {% csrf_token %}
    <input type="hidden" name="version"
           value="{{ form.instance.version }}">
    <div class="form-grid">{{ form }}</div>
    <div class="form-actions">
      <button type="submit" class="btn btn-primary">
        Save changes</button>
    </div>
  </form>
  <p>
    <a href="{% url 'events:detail' event_id %}">
      Back to the event</a>
  </p>
{% endblock %}
