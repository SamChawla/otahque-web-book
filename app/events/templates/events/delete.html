{% extends "base.html" %}

{% block title %}Delete {{ event.title }} |
  Otahque{% endblock %}

{% block content %}
  <h1>Delete {{ event.title }}?</h1>
  <p>This draft and its organizer list will be removed. It
     cannot be undone.</p>
  <form method="post" class="card space-y-4 border
        border-base-300 bg-base-100 p-6">
    {% csrf_token %}
    <button type="submit" class="btn btn-error">
      Delete draft</button>
  </form>
  <p>
    <a href="{{ event.get_absolute_url }}">Keep it</a>
  </p>
{% endblock %}
