{% extends "base.html" %}
{% load static %}

{% block title %}New event | Otahque{% endblock %}

{% block content %}
  <h1>New event</h1>
  <p>Otahque saves it as a draft. Only its organizers and
     the administrator can see it until it is published.</p>
  <form method="post" class="card space-y-4 border
        border-base-300 bg-base-100 p-6">
    {% csrf_token %}
    {{ form }}
    <button type="submit" class="btn btn-primary">
      Save draft</button>
  </form>
  <script src="{% static 'otahque/event-zone.js' %}"
          defer></script>
{% endblock %}
