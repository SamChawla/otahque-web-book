{% load allauth %}
{{ attrs.errors }}
<div class="fieldset">
  {% if attrs.type == "checkbox" or attrs.type == "radio" %}
    <label>
      <input type="{{ attrs.type }}" id="{{ attrs.id }}"
        {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
        {% if attrs.value is not None %}
          value="{{ attrs.value }}"{% endif %}
        {% if attrs.checked %}checked{% endif %}
        {% if attrs.disabled %}disabled{% endif %}>
      {% slot label %}{% endslot %}</label>
  {% else %}
    <label class="fieldset-legend" for="{{ attrs.id }}">
      {% slot label %}{% endslot %}</label>
    {% if attrs.type == "textarea" %}
      <textarea class="textarea w-full" id="{{ attrs.id }}"
        {% if attrs.rows %}rows="{{ attrs.rows }}"{% endif %}
        {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
        {% if attrs.readonly %}readonly{% endif %}
        >{% slot value %}{% endslot %}</textarea>
    {% else %}
      <input class="input w-full" id="{{ attrs.id }}"
        type="{{ attrs.type }}"
        {% if attrs.name %}name="{{ attrs.name }}"{% endif %}
        {% if attrs.value is not None %}
          value="{{ attrs.value }}"{% endif %}
        {% if attrs.placeholder %}
          placeholder="{{ attrs.placeholder }}"{% endif %}
        {% if attrs.autocomplete %}
          autocomplete="{{ attrs.autocomplete }}"{% endif %}
        {% if attrs.disabled %}disabled{% endif %}
        {% if attrs.readonly %}readonly{% endif %}
        {% if attrs.required %}required{% endif %}>
    {% endif %}
  {% endif %}
  {% if slots.help_text %}
    <p class="label whitespace-normal">
      {% slot help_text %}{% endslot %}</p>
  {% endif %}
</div>
