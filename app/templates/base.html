{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>{% block title %}Otahque{% endblock %}</title>
  <link rel="stylesheet"
        href="{% static 'otahque/site.css' %}">
  <script src="{% static 'otahque/site.js' %}"
          defer></script>
</head>
<body>
  {% include "includes/site_nav.html" %}
  <main class="mx-auto w-full max-w-6xl space-y-4 px-4 pt-6
               pb-12 sm:px-6 lg:px-8">
    {% if messages %}
      <div role="status" class="space-y-2">
        {% for message in messages %}
          <div class="alert
            {% if message.level_tag == 'error' %}alert-error
            {% else %}alert-success{% endif %}">
            <span>{{ message }}</span>
            <button type="button" data-close
                    class="btn btn-ghost btn-sm ml-auto">
              Close</button>
          </div>
        {% endfor %}
      </div>
    {% endif %}
    {% block page %}
      {% block content %}{% endblock %}
    {% endblock %}
  </main>
</body>
</html>
