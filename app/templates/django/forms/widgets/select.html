{% load otahque_widgets %}
<select name="{{ widget.name }}"
        {{ widget.attrs|with_class:"select w-full" }}>
{% spaceless %}
{% for group, choices, index in widget.optgroups %}
  {% if group %}<optgroup label="{{ group }}">{% endif %}
  {% for option in choices %}
    {% include option.template_name with widget=option %}
  {% endfor %}
  {% if group %}</optgroup>{% endif %}
{% endfor %}
{% endspaceless %}
</select>
