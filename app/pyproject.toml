[project]
name = "otahque"
version = "0.1.0"
requires-python = ">=3.14.9"
dependencies = [
    "disposable-email-domains==0.0.295",
    "django==6.1.2",
    "django-allauth[mfa,socialaccount]==65.22.1",
    "django-phonenumber-field[phonenumbers]==9.0.0",
    "phonenumbers==9.0.44",
    "psycopg[binary]==3.3.9",
    "python-decouple==3.8",
]

[dependency-groups]
dev = [
    "coverage==7.17.4",
    "tblib==3.2.2",
]

[tool.coverage.run]
# Measure the project's own code, not its tests.
source = ["accounts", "audit", "config", "events",
          "registrations"]
omit = ["*/migrations/*", "*/tests/*", "config/helpers.py"]
branch = true
# test --parallel runs the tests in several processes:
# each writes its own data file, and combine joins them.
parallel = true
concurrency = ["multiprocessing", "thread"]

[tool.coverage.report]
show_missing = true
skip_covered = true
